
# =====================================================
# APPLICATION
# =====================================================

server.port=8089


# =====================================================
# DATABASE - POSTGRESQL
# =====================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventflow_db}
spring.datasource.username=${DB_USERNAME:eventflow_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

# Liquibase manages the database schema.
# Hibernate must not create or modify tables.
spring.jpa.hibernate.ddl-auto=validate

# Display SQL statements during development.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# =====================================================
# LIQUIBASE
# =====================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql


# =====================================================
# LOGGING
# =====================================================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.liquibase=INFO

